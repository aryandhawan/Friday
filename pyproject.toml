[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-cli"
version = "0.1.0"
description = "F.R.I.D.A.Y. multi-agent coding assistant"
requires-python = ">=3.10"

[project.scripts]
friday = "main:main"

[tool.setuptools]
py-modules = ["main", "pipeline", "planner_agent", "coder_agent", "editor_agent", "sandbox"]

[tool.setuptools.packages.find]
include = ["ui*", "core*", "ascii_art*"]
